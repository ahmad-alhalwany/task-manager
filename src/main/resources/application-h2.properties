# Activate with: --spring.profiles.active=h2
# or: SPRING_PROFILES_ACTIVE=h2
# H2 is an in-memory DB — zero setup, data vanishes when the process stops.

spring.datasource.url=jdbc:h2:mem:taskmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Browser console at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:taskmanager
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
