# Default profile: PostgreSQL (used by Docker / production)
# Env vars override these — same idea as FastAPI Settings + pydantic-settings.

spring.application.name=task-manager-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskmanager}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taskmanager}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Base64-encoded 256-bit secret (override in production!)
app.jwt.secret=${JWT_SECRET:dGFza21hbmFnZXItand0LXNlY3JldC1rZXktY2hhbmdlLW1lLTMyYnl0ZXMhISE=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=${SERVER_PORT:8080}
